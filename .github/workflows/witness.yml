name: witness
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: assertion suites (must be green)
        run: |
          node test.mjs
          node shadow.test.mjs
          node wire.test.mjs
      - name: witness — core.mjs
        run: |
          git clone --depth 1 https://github.com/sjgant80-hub/witness.git .witness
          node .witness/witness.mjs mutate core.mjs --cap 200 --baseline witness.baseline.json --test node test.mjs
      - name: witness — shadow.mjs
        run: node .witness/witness.mjs mutate shadow.mjs --cap 200 --test node shadow.test.mjs
      - name: witness — wire.mjs (the real organs wired to the core)
        run: node .witness/witness.mjs mutate wire.mjs --cap 200 --test node wire.test.mjs
