name: witness
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: assertion suites
        run: |
          node test.mjs
          node shadow.test.mjs
          node wire.test.mjs
          node didy.test.mjs
          node depth.test.mjs
          node estate.test.mjs
          node organs/t0.test.mjs
          node organs/t1.test.mjs
          node organs/isa.test.mjs
          node kitka.test.mjs
      - name: mutation gate (witness)
        # Pinned to a TAG, not the default branch. An unpinned clone means the gate that proves this
        # repo can change underneath it without a commit here — the result would stop being a fact
        # about this code and become a fact about whatever witness happened to be that morning.
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git .witness
          node .witness/witness.mjs mutate core.mjs        --cap 200 --baseline witness.baseline.json --test node test.mjs
          node .witness/witness.mjs mutate shadow.mjs      --cap 200 --test node shadow.test.mjs
          node .witness/witness.mjs mutate wire.mjs        --cap 200 --test node wire.test.mjs
          node .witness/witness.mjs mutate didy.mjs        --cap 200 --test node didy.test.mjs
          node .witness/witness.mjs mutate depth.mjs       --cap 200 --test node depth.test.mjs
          node .witness/witness.mjs mutate organs/t0.mjs   --cap 400 --test node organs/t0.test.mjs
          node .witness/witness.mjs mutate organs/t1.mjs   --cap 400 --test node organs/t1.test.mjs
          node .witness/witness.mjs mutate handshake.mjs   --cap 400 --test node kitka.test.mjs
          node .witness/witness.mjs mutate walk.mjs        --cap 400 --test node kitka.test.mjs
